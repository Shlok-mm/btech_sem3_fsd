<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form>
        
        <fieldset> 
            <legend> Scale ordered pizza</legend>
            <table border=0 width="70" rules="all" cellspacing="10"> 
                <tr>
                    <td>Scale</td>
                    <td>Good </td>
                    <td>Avg </td>
                    <td>Bad </td>
                </tr>
                <tr>
                    <td>Quality</td>
                    <td> <input type="radio" </td>
                    <td> <input type="radio" </td>
                    <td> <input type="radio" </td>
                </tr>

                <tr>
                    <td>Quantity</td>
                    <td> <input type="radio" </td>
                    <td> <input type="radio" </td>
                    <td> <input type="radio" </td>
                </tr>

                <tr>
                    <td>Freshness</td>
                    <td> <input type="radio" </td>
                    <td> <input type="radio" </td>
                    <td> <input type="radio" </td>
                </tr>

                <tr> 
                    <td> Overall rating</td>
                    <td colspan="3" align="center"> <input type="range" min="1" max="10"> </td>
                </tr>
                
                

                </table>
            <input type="submit" value="submit">
        </fieldset>
    </form>
</body>
</html>
