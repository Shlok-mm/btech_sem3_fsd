<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Class </title>
    <style>
        a:link{color:blueviolet}
        a:visited{color: brown;}
        a:hover{
            color: rgb(101, 1, 18);
            font-size: 100px;
            background-color:bisque;
        }
        a:active{color:yellowgreen;}
        input:focus{
            background-color: beige;
            
        }
        li:nth-child(2){
            color:red;
            font-size: large;
        }
        .not:not(.special){
            color: red;
            font-size: large;

            }
        


    </style>
</head>
<body style="text-align: center;">
        <h2> Styling link depending on state or position  </h2>
        <br>
        <br>
        <br>

        <p>
            <b><a href="https://www.google.com/" target="_blank"> This is a link </a> </b>
            <br>
            <br>
            <br>
            <br>
            Name : <input type="text" placeholder="click to focus "> 
            <br>
            <br>
            <br>
            <br>
            <ul style="text-align:left;">
                <li> List 1 </li>
                <li> List 2 </li>
                <li> List 3 </li>
                <li> List 4 </li>
            </ul>
            <br>
            <br>
            <br>
            <br>
            <ul class="not" style="text-align:left;">
                <li> List 1 </li>
                <li> List 2 </li>
                <li> List 3 </li>
                <li> List 4 </li>
            </ul>
        </p>
    
</body>
</html>
