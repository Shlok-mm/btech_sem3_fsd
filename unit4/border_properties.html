<!DOCTYPE html>
<html lang="en">
<head>

        body{
            background-color:bisque;
            font-family: 'Courier New', Courier, monospace;

        }
        p.one{

            border-width: thick;
            border-color:brown;
            border-radius: 50px;


        }

</head>

        <br>
        <br>
        <br>
        goodnight
    </p>

</body>
</html>
