<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Property </title>

    <style>
        .box{
            background-color: bisque;
            border: 5px solid brown;
            padding: 10px;
            margin: 5px;
            border-radius: 10px; 
        }
        .inline div{
            display:inline;
            background-color: beige;
            border: 2px solid black;
            padding: 5px; 
            border-radius: 10px; 
            margin: 5px;
        }
        .block span{
            display: block;
            background-color:beige;
            border: 2px solid black;
            padding: 5px; 
            border-radius: 10px; 
            margin: 5px;
            height: 20px;
            width: 100px;  
        }
        .inline-block div{
            display: block;
            background-color:beige;
            border: 2px solid black;
            padding: 5px; 
            border-radius: 10px; 
            margin: 5px;
            height: 20px;
            width: 500px;
        }
        .none p{
            display: none;
        }
    </style>

</head>
<body style="text-align: center; font-family: 'Courier New', Courier, monospace;" >
    <h1><u> CSS DISPLAY Property </u></h1>
    <h2> DISPLAY INLINE</h2>
    <div class="inline box">
        <div> Inline - 1</div>
        <div> Inline - 2</div>
        <div> Inline - 3</div>
        <div> Inline - 4</div>
    </div>


    <h2> DISPLAY BLOCK</h2>
    <div class="block box">
        <span> Block - 1</span>
        <span> Block - 2</span>
        <span> Block - 3</span>
        <span> Block - 4</span>
    </div>
    

    <h2> DISPLAY INLINE-BLOCK</h2>
    <div class="inline-block box">
        <div> Inline Block - 1 </div>
        <div> Inline Block - 2 </div>
        <div> Inline Block - 3 </div>
        <div> Inline Block - 4 </div>
    </div>
    
    <h2> DISPLAY none</h2>
    <div class="none">
    <p>
        this text is hidden 
    </p>
    </div>
    <p>
        this text is not hidden 
    </p>

</body>
</html>
