<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid-fr{
            display: grid;
            grid-template-columns: 200px 1fr 2fr 5fr;
            gap: 10px;
            background-color: bisque;
            padding: 10px;
            margin-bottom:40px ;
            border:5px solid brown;
            border-radius: 15px;
        }
        .item{
            background-color: beige;
            text-align: center;
            padding: 20px;  
            border-radius: 15px;
            border:2px solid black;

        }

    </style>
</head>
<body>
    <div class="grid-fr">
        <div class="item"> 200px</div>
        <div class="item"> 1fr </div>
        <div class="item"> 2fr </div>
        <div class="item"> 5fr </div>
    </div>
</body>
</html>
