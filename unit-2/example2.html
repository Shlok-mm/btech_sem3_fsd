<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>time table</title>
</head>
<body>
    <table border="2" align="center"> 
        <caption> Time Table</caption>
        <thead>
            <tr bgcolor="lightpink" align="center">
                <th> Day </th>
                <th> I <br> 9:00-10:00 </th>
                <th> II <br> 10:00-11:00 </th>
                <th> III <br> 11:00-12:00 </th>
                <th> 12:00-12:30 </th>
                <th> IV <br> 12:30-1:30 </th>
                <th> V  <br> 1:30-2:30 </th>
                <th> VI <br> 2:30-3:30 </th>
            </tr>
        </thead>
        <tbody> 
            <tr align="center">
                <th> Monday </td>
                <td> Eng </td>
                <td> Math </td>
                <td> che </td>
                <td rowspan="5" BGCOLOR="yellow" > LUNCH </td>
                <td colspan="2" bgcolor="lightblue" > LAB </td>
                <td> Eng </td>
             </tr>
             <tr align="center">
                <th> Tuesday </td>
                <td colspan="3" bgcolor="lightblue"> LAB </td>
                <td> Eng </td>
                <td> che </td>
                <td> Math </td>
            </tr>
            <tr align="center" >
                <th> Wednesday </th> 
                <td> mat </td>
                <td> phy </td>
                <td> eng </td>
                <td colspan="3" bgcolor="lightblue"> LIBRARY</td>
            </tr>
            <tr align="center">
                <th> Thursday </th> 
                <td> phy </td>
                <td> eng </td>
                <td> che </td>
                <td colspan="2" bgcolor="lightblue"> LAB</td>
                <td> mat </td>
            </tr>
            <tr align="center">
                <th> Friday </th>
                <td colspan="3" bgcolor="lightblue"> LAB</td>
                <td> phy </td>
                <td> eng </td>
                <td> mat </td>


            </tr>
        </tbody>
    </table>
</body>
</html>
