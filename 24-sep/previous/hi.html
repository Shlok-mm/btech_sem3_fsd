<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <svg height="200" width="200" style="border:1px solid blue ;">
        <line x1="100" y1="0" x2="200" y2="200" stroke="black" stroke-width="2"/>
        <line x2="100" y1="200" x2="100" y2="0" stroke="black" stroke-width="2"/>
        <line x1="0" y1="200" x2="200" y2="200" stroke="black" stroke-width="5"/>
    </svg>
    <svg height="200" width="200" style="border:1px solid blue ;">
        <rect x="0" y="0" height="100" width="150" stroke="red" stroke width="5" fill="blue"/>
        <rect x="50" y="150" height="100" width="150" stroke="red" stroke width="5" fill="blue" xr="60" xy="160"/>
    </svg>
    <svg height="400" width="400" style="border:1px solid blue ;">
        <rect x="0" y="0" height="100" width="300" stroke="black" stroke width="5" fill="cyan"/>
        <rect x="100" y="50" height="300" width="100" stroke="black" stroke width="5" fill="blue"/>
        </svg>
    <svg height="300" width="500" style="border:1px solid blue ;">
        <rect x="0" y="0" height="500" width="300" stroke="black" stroke width="5" fill="orange"/>
        <rect x="0" y="100" height="500" width="300" stroke="black" stroke width="5" fill="white"/>
        <rect x="0" y="200" height="500" width="300" stroke="black" stroke width="5" fill="green"/>
        <circle cx="150" cy="150" r="50" stroke="black" stroke-width="5" fill="blue"/>"
    </svg>
</body>
</html>
